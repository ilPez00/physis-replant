name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release
      - name: Read-only automation scanner and real Replant receipts
        env:
          REPLANT_BIN: ${{ github.workspace }}/target/release/replant
        run: python3 -m unittest discover -s scripts -p test_scan_automation.py -v
      - run: python3 scripts/benchmark.py --binary target/release/replant
      - name: Python SDK and adapters
        working-directory: sdk/python
        run: python3 -m unittest -v test_client.py test_adapters.py
      - name: TypeScript SDK
        working-directory: sdk/typescript
        run: node --test test.mjs
      - name: n8n community node
        working-directory: n8n-nodes-replant
        run: node --test test/node.test.js
