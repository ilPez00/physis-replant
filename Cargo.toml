[package]
name = "physis-replant"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Persist verified AI tool recipes and re-execute them locally without repeat inference."
repository = "https://github.com/ilPez00/physis-replant"
keywords = ["ai", "cost", "crystallization", "memoization", "agent"]
categories = ["development-tools", "caching"]

[dependencies]
physis-memory = { path = "crates/physis-memory", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "replant"
path = "src/main.rs"

[workspace]
members = ["crates/physis-memory"]
resolver = "2"
