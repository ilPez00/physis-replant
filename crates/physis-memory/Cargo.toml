[package]
name = "physis-memory"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Shared Physis observation types and locked append-only memory, without a runtime or models."
repository = "https://github.com/ilPez00/physis-replant"

[features]
default = ["store"]
store = ["dep:anyhow", "dep:libc"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = { version = "1", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
